# 1. Le decimos al periodista que hable por DOS canales: consola (stdout) y archivo (file)
log4j.rootLogger=INFO, stdout, file

# ==========================================
# CANAL 1: LA CONSOLA DE ECLIPSE (Lo que ya tenías)
# ==========================================
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# ==========================================
# CANAL 2: EL ARCHIVO DE TEXTO (La nueva libreta)
# ==========================================
# Usamos "RollingFileAppender" para que el archivo no se vuelva infinito y pese 100GB
log4j.appender.file=org.apache.log4j.RollingFileAppender

# AQUÍ DEFINIMOS LA RUTA Y EL NOMBRE DEL ARCHIVO:
# Se creará una carpeta "logs" dentro de la carpeta "target" de tu proyecto
log4j.appender.file.File=target/logs/reporte-automatizacion.log

# Reglas de limpieza: Si el archivo llega a 5MB, crea uno nuevo y guarda hasta 3 respaldos
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=3

# El formato en el que escribirá dentro del archivo de texto
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n